<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Wrap Master</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* CMYK (1, 32, 89, 0) -> HEX #FCAE1D */
            background-color: #FCAE1D;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .main-wrapper {
            position: relative;
            width: 320px;
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* 1. პირველი გვერდი (სრული ბლოკი) */
        .page-one {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            z-index: 2;
        }

        .header-text {
            font-size: 22px;
            font-weight: 800;
            color: #1e1e1e;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        .click-hint {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #1e1e1e;
            padding: 12px 28px;
            border-radius: 30px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* 2. მეორე გვერდი (რომელიც ამოვა) */
        .page-two {
            position: absolute;
            width: 290px;
            background-color: #ffffff;
            border-radius: 24px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            z-index: 1;
            opacity: 0;
            transform: translateY(120px) scale(0.8);
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
            pointer-events: none;
        }

        .summer-bonus {
            font-size: 20px;
            font-weight: bold;
            color: #1e1e1e;
            margin-bottom: 15px;
        }

        .amount {
            font-size: 40px;
            font-weight: 900;
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* დაჭერისას გადაშლის / ამოწევის ეფექტი */
        .main-wrapper.open .page-one {
            transform: translateY(-150px) rotate(-10deg) scale(0.7);
            opacity: 0;
            pointer-events: none;
        }

        .main-wrapper.open .page-two {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="main-wrapper" id="wrapper" onclick="nextPage()">
        
        <!-- პირველი გვერდი -->
        <div class="page-one">
            <div class="header-text">From Wrap Master</div>
            <img src="Wrap Master_Icon_shadow.png" alt="Wrap Master Logo" class="logo-img">
            <div class="click-hint">Click! 👆</div>
        </div>

        <!-- მეორე გვერდი (ამოვა დაჭერისას) -->
        <div class="page-two">
            <div class="summer-bonus">Summer Bonus</div>
            <div class="amount">🎁 500 ლარი</div>
        </div>

        <!-- მუსიკა -->
        <audio id="myAudio" src="music-is-.mp3"></audio>
    </div>

    <script>
        function nextPage() {
            var wrapper = document.getElementById('wrapper');
            if (!wrapper.classList.contains('open')) {
                wrapper.classList.add('open');
                
                // მუსიკის ჩართვა
                var audio = document.getElementById('myAudio');
                audio.play();
            }
        }
    </script>

</body>
</html>
