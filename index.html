<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Wrap Master</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* CMYK (1, 32, 89, 0) -> HEX #FCAE1D */
            background-color: #FCAE1D;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 320px;
            height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-text {
            font-size: 22px;
            font-weight: 800;
            color: #1e1e1e;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.4s ease;
        }

        /* ლოგოს კონტეინერი შუაზე გასაყოფად */
        .logo-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            z-index: 2;
        }

        .logo-half {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background-image: url('Wrap Master_Icon_shadow.png');
            background-size: 220px 220px;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .logo-left {
            left: 0;
            background-position: left center;
        }

        .logo-right {
            right: 0;
            background-position: right center;
        }

        /* ღილაკი Click! 👆 */
        .click-hint {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #1e1e1e;
            padding: 12px 28px;
            border-radius: 30px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            animation: pulse 1.5s infinite;
            z-index: 2;
            transition: opacity 0.4s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* შიგნიდან ამოსასვლელი ბარათი */
        .bonus-card {
            position: absolute;
            width: 280px;
            background-color: #ffffff;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            z-index: 1;
            opacity: 0;
            transform: scale(0.3) translateY(0);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
        }

        .summer-bonus {
            font-size: 20px;
            font-weight: bold;
            color: #1e1e1e;
            margin-bottom: 15px;
        }

        .amount {
            font-size: 38px;
            font-weight: 900;
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* გახსნილი მდგომარეობის ანიმაციები */
        .container.open .logo-left {
            transform: translateX(-140px) rotate(-10deg);
            opacity: 0;
        }

        .container.open .logo-right {
            transform: translateX(140px) rotate(10deg);
            opacity: 0;
        }

        .container.open .header-text,
        .container.open .click-hint {
            opacity: 0;
            pointer-events: none;
        }

        .container.open .bonus-card {
            opacity: 1;
            transform: scale(1) translateY(0);
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer" onclick="openBonus()">
        <div class="header-text">From Wrap Master</div>

        <!-- შუაზე გასაყოფი ლოგო -->
        <div class="logo-wrapper">
            <div class="logo-half logo-left"></div>
            <div class="logo-half logo-right"></div>
        </div>

        <div class="click-hint" id="hint">Click! 👆</div>

        <!-- შიგნიდან ამოსული ბონუსის ბარათი -->
        <div class="bonus-card">
            <div class="summer-bonus">Summer Bonus</div>
            <div class="amount">🎁 500 ლარი</div>
        </div>

        <!-- მუსიკალური ფაილი -->
        <audio id="myAudio" src="music-is-.mp3"></audio>
    </div>

    <script>
        function openBonus() {
            var container = document.getElementById('mainContainer');
            if (!container.classList.contains('open')) {
                container.classList.add('open');
                
                // სიმღერის ჩართვა
                var audio = document.getElementById('myAudio');
                audio.play();
            }
        }
    </script>

</body>
</html>
